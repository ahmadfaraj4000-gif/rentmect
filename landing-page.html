<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Rent Me CT | Connecticut Car Rentals</title>
  <meta
    name="description"
    content="Rent Me CT offers clean, reliable car rentals in Farmington, Connecticut near Hartford and Bradley International Airport."
  />
  <meta name="robots" content="index, follow" />
  <meta name="geo.region" content="US-CT" />
  <meta name="geo.placename" content="Farmington" />
  <meta name="geo.position" content="41.7202127;-72.7843670" />
  <meta name="ICBM" content="41.7202127, -72.7843670" />

  <link rel="icon" href="assets/logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #f3f4f6;
      --panel: #ffffff;
      --olive: #123d2a;
      --olive-dark: #1d5039;
      --olive-soft: #e6f0ea;
      --text: #16202b;
      --muted: #5f6975;
      --line: rgba(18, 28, 45, 0.10);
      --shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Barlow', Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(18, 61, 42, 0.09), transparent 25%),
        linear-gradient(180deg, #fafbfc, #eef2f5);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .phone-banner {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 34px;
      padding: 7px max(20px, calc((100vw - 1240px) / 2));
      background: #123d2a;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
    }

    .phone-banner a {
      color: #fff;
      font-weight: 800;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    @media (max-width: 560px) {
      .phone-banner {
        justify-content: center;
        font-size: 11px;
      }

      .phone-banner span:last-child {
        display: none;
      }
    }

    .page {
      width: 100%;
      max-width: 420px;
      padding: 30px 20px;
      text-align: center;
    }

    .logo-card {
      width: 150px;
      height: 112px;
      display: inline-grid;
      place-items: center;
      padding: 20px 26px;
      border-radius: 20px;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow:
        0 18px 40px rgba(15, 23, 42, 0.10),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      margin-bottom: 18px;
    }

    .logo-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    h1 {
      font-family: 'Bebas Neue', Arial, Helvetica, sans-serif;
      margin: 0;
      color: var(--text);
      font-size: 46px;
      line-height: 1;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 400;
    }

    .tagline {
      margin: 0 0 30px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 400;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .button {
      width: 100%;
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 18px;
      border-radius: 9px;
      border: 1px solid var(--line);
      font: 850 13px 'Barlow', Arial, Helvetica, sans-serif;
      letter-spacing: 0;
      transition:
        border-color 0.18s ease,
        color 0.18s ease,
        background 0.18s ease;
    }

    .button:focus-visible {
      outline: 3px solid rgba(18, 61, 42, 0.3);
      outline-offset: 3px;
    }

    .button-primary {
      color: #fff;
      background: var(--olive);
      border-color: var(--olive);
      box-shadow: none;
    }

    .button-primary:hover {
      border-color: var(--olive-dark);
      background: var(--olive-dark);
    }

    .button-light {
      background: #ffffff;
      color: var(--text);
      border-color: #cfd9d6;
      box-shadow: none;
    }

    .button-light:hover {
      border-color: var(--olive);
      background: var(--olive-soft);
      color: var(--olive-dark);
    }

    .location {
      margin: 28px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .powered-by {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .powered-by a {
      color: var(--olive);
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="phone-banner">
    <span>Call/Text 24/7: <a href="tel:+18605586031">860-558-6031</a></span>
    <span>Reliable Car Rentals in Connecticut</span>
  </div>

  <main class="page">
    <div class="logo-card" aria-label="Rent Me CT">
      <img src="assets/logo.png" alt="Rent Me CT Logo" />
    </div>

    <h1>Rent Me CT</h1>
    <p class="tagline">Connecticut Car Rentals</p>

    <nav class="links" aria-label="Rent Me CT quick links">
      <a class="button button-primary" href="https://rentmect.com/">Visit Our Website</a>

      <!-- Replace # with your Instagram link. -->
      <a class="button button-light" href="https://www.instagram.com/rentmect?igsh=Z2J5aHVhMGZtbTR6">Instagram</a>

      <!-- Replace # with your Facebook link. -->
      <a class="button button-light" href="https://www.facebook.com/share/1GRXbBefVu/?mibextid=wwXIfr">Facebook</a>

      <a class="button button-light" href="tel:+18605586031">Call Now</a>
    </nav>

    <p class="location">Farmington, CT</p>

    <footer class="powered-by">
      Powered by <a href="https://reimagebs.com" target="_blank" rel="noopener">REIMAGE BUSINESS SOLUTIONS</a>
    </footer>
  </main>
</body>
</html>
