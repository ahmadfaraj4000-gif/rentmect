name: Canonical booking page guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  booking-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Cars-2 and legacy-route contracts
        run: npm run audit:canonical-booking
      - name: Verify protected booking holds and retired Wheelbase relay
        run: npm run audit:booking-hold-security
      - name: Verify Eastern defaults and homepage handoff
        run: npm run audit:booking-default-time
      - name: Verify phone profile-save guard
        run: npm run audit:phone-profile-save
      - name: Verify late-return and mileage policy
        run: npm run audit:late-fee-mileage
      - name: Verify daylight-saving rental days
        run: |
          node --test tools/test-daylight-saving-fleet.mjs
          python3 tools/test-daylight-saving-billing.py
      - name: Verify fresh-visit defaults in desktop and mobile browsers
        env:
          PLAYWRIGHT_MODULE: /tmp/rentme-browser-tools/node_modules/playwright/index.mjs
          PLAYWRIGHT_CHANNEL: chromium
        run: |
          npm install --prefix /tmp/rentme-browser-tools --no-save --package-lock=false playwright@1.65.0
          node /tmp/rentme-browser-tools/node_modules/playwright/cli.js install --with-deps chromium
          node tools/test-public-trip-browser.mjs
