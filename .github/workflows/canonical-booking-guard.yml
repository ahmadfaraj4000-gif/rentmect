name: Canonical booking page guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  booking-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Cars-2 and legacy-route contracts
        run: npm run audit:canonical-booking
      - name: Verify Eastern defaults and homepage handoff
        run: npm run audit:booking-default-time
      - name: Verify phone profile-save guard
        run: npm run audit:phone-profile-save
