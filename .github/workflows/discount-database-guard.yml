name: Rental lifecycle regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  complete-schema-discounts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install database client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify complete schema, booking lifecycle, money invariants and concurrent requests
        env:
          RENTMECT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          PG_BINDIR: /usr/bin
        run: python3 tools/test-discount-full-schema.py

  flexible-payments:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install database client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify complete schema, booking lifecycle, money invariants and concurrent requests
        env:
          RENTMECT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          PG_BINDIR: /usr/bin
        run: python3 tools/test-flexible-payments-full-schema.py

  admin-return-policy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install database client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify physical returns, extensions, swaps, and concurrent availability
        env:
          RENTMECT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          PG_BINDIR: /usr/bin
        run: python3 tools/test-admin-return-policy.py

  payment-handlers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify payment and refund handlers with fake providers
        run: node --test tools/test-admin-booking-errors.mjs tools/deposit-review-handler.test.mjs tools/allocated-stripe-payment.test.mjs tools/allocated-payment-message.test.mjs tools/test-vehicle-swap-payments.mjs tools/test-rental-balance-refunds.mjs tools/external-toll-payment.test.mjs tools/unified-external-payment.test.mjs tools/flexible-stripe-remainder.test.mjs tools/test-customer-installment-checkout.mjs
