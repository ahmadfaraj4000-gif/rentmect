name: Discount database lifecycle
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  complete-schema-discounts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install database client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify discount, extension, receipt, deposit and permission invariants
        env:
          RENTMECT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          PG_BINDIR: /usr/bin
        run: python3 tools/test-discount-full-schema.py
